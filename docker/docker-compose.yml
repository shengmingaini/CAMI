  # ================================================================
  # MySQL — 8 shard masters + 8 shard replicas (GTID) + 1 global
  # ================================================================
  # ---- shard 0 ----
  mysql-shard-0:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=cami_dev_2026
      - MYSQL_DATABASE=cami_shard_0
    ports:
      - "3306:3306"
    volumes:
      - mysql-shard-0-data:/var/lib/mysql
      - ./mysql/init-shard.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/repl-master.sql:/docker-entrypoint-initdb.d/02-repl.sql:ro
    networks: [cami-net]
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --server-id=10 --log-bin=mysql-bin --binlog-format=ROW
      --gtid_mode=ON --enforce_gtid_consistency=ON
      --innodb-buffer-pool-size=32M --performance-schema=OFF --max-connections=200
  mysql-shard-0-s:
    image: mysql:8.0
