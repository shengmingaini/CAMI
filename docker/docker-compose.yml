  # ================================================================
  # ShardingSphere Proxy — PlayerID-based sharding
  # ================================================================
  shardingsphere-proxy:
    image: apache/shardingsphere-proxy:5.5.0
    depends_on:
      - mysql-shard-0
      - mysql-shard-0-s
      - mysql-shard-1
      - mysql-shard-1-s
      - mysql-shard-2
      - mysql-shard-2-s
      - mysql-shard-3
      - mysql-shard-3-s
      - mysql-shard-4
      - mysql-shard-4-s
      - mysql-shard-5
      - mysql-shard-5-s
      - mysql-shard-6
      - mysql-shard-6-s
      - mysql-shard-7
      - mysql-shard-7-s
    ports:
      - "3309:3307"
    volumes:
      - ./shardingsphere/server.yaml:/opt/shardingsphere-proxy/conf/server.yaml
      - ./shardingsphere/config-cami_db.yaml:/opt/shardingsphere-proxy/conf/config-cami_db.yaml
      - ./shardingsphere/ext-lib:/opt/shardingsphere-proxy/ext-lib
    networks:
      - cami-net
    environment:
      - JVM_OPTS=-Xmx256m -Xms256m

  # ================================================================
  # Kafka — single node for local dev
  # ================================================================
  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - cami-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - cami-net

  # ================================================================
  # Monitoring
  # ================================================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - cami-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: cami_dev
    depends_on:
      - prometheus
    networks:
      - cami-net

