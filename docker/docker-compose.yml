# CAMI Local Development Environment (v2.0 — Tech Stack Verification)
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   bash docker/redis/init-cluster.sh   # initialize Redis cluster
#
# Services:
#   Redis Cluster  — 6 nodes (3 master + 3 slave), ports 7000-7005
#   MySQL          — 2 shard DBs + 1 global DB, ports 3306-3308
#   ShardingSphere — Proxy with PlayerID sharding, port 3309
#   Kafka          — single node for async messaging, port 9092
#   Monitoring     — Prometheus (9090) + Grafana (3000)

version: "3.8"

services:
  # ================================================================
  # Redis Cluster — 3 Master + 3 Slave
  # ================================================================
  redis-node-1:
    image: redis:7-alpine
    command: >
      redis-server
      --port 7000
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname redis-node-1
      --cluster-announce-port 7000
      --cluster-announce-bus-port 17000
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "7000:7000"
      - "17000:17000"
    volumes:
      - redis-1-data:/data
      - ./redis/init-cluster.sh:/scripts/init-cluster.sh:ro
    networks:
      - cami-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

