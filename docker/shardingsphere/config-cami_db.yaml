databaseName: cami_db

# ============================================================================
# CAMI ShardingSphere 配置 — 8 分库 + 读写分离 (Week 4 Day 2)
# ----------------------------------------------------------------------------
# 分片键 : player_id  (ADR-003)
# 分片算法: player_id % 8  -> ds_0 .. ds_7
# 读写分离: 每个分片 ds_N 由 RW-Splitting 逻辑名承载
#            写 -> ds_N_m (主, mysql-shard-N)
#            读 -> ds_N_s (从, mysql-shard-N-s, GTID 复制)
# 注意    : 代理登录用 root/root (SS 5.5.0 frontend 怪癖, 见 server.yaml);
#           后端 MySQL 仍用 cami_dev_2026。
# ============================================================================

