rules:
  # --------------------------------------------------------------------------
  # 读写分离: 逻辑数据源 ds_0..7 指向 (主=写, 从=读)
  # --------------------------------------------------------------------------
  - !READWRITE_SPLITTING
    # SS 5.2+ 语法: 去掉 type:Static / props 包裹, 直接写驼峰字段
    dataSources:
      ds_0:
        writeDataSourceName: ds_0_m
        readDataSourceNames:
          - ds_0_s
      ds_1:
        writeDataSourceName: ds_1_m
        readDataSourceNames:
          - ds_1_s
      ds_2:
        writeDataSourceName: ds_2_m
        readDataSourceNames:
          - ds_2_s
      ds_3:
        writeDataSourceName: ds_3_m
        readDataSourceNames:
          - ds_3_s
      ds_4:
        writeDataSourceName: ds_4_m
        readDataSourceNames:
          - ds_4_s
      ds_5:
        writeDataSourceName: ds_5_m
        readDataSourceNames:
          - ds_5_s
      ds_6:
        writeDataSourceName: ds_6_m
        readDataSourceNames:
          - ds_6_s
      ds_7:
        writeDataSourceName: ds_7_m
        readDataSourceNames:
          - ds_7_s

  # --------------------------------------------------------------------------
  # 分片: 8 张玩家表, 按 player_id % 8 路由到 ds_0..7 (RW 逻辑名)
  # --------------------------------------------------------------------------
  - !SHARDING
    tables:
      player_base:
        actualDataNodes: ds_${0..7}.player_base
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_inventory:
        actualDataNodes: ds_${0..7}.player_inventory
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_currency:
        actualDataNodes: ds_${0..7}.player_currency
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_equipment:
        actualDataNodes: ds_${0..7}.player_equipment
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_quest:
        actualDataNodes: ds_${0..7}.player_quest
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_skill:
        actualDataNodes: ds_${0..7}.player_skill
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_mail:
        actualDataNodes: ds_${0..7}.player_mail
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_social:
        actualDataNodes: ds_${0..7}.player_social
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
    defaultDatabaseStrategy:
      none:
    defaultTableStrategy:
      none:
    shardingAlgorithms:
      player_id_inline:
        type: INLINE
        props:
          algorithm-expression: ds_${player_id % 8}
