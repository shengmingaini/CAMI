rules:
  # --------------------------------------------------------------------------
  # 分片: 8 张玩家表, 按 player_id % 8 路由到 ds_0..7 (直接物理名, 无 RW 逻辑名)
  # 扩容时此规则段【零改动】, 仅改上方 dataSource URL。
  # --------------------------------------------------------------------------
  - !SHARDING
    tables:
      player_base:
        actualDataNodes: ds_${0..7}.player_base
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_state:
        actualDataNodes: ds_${0..7}.player_state
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_inventory:
        actualDataNodes: ds_${0..7}.player_inventory
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_currency:
        actualDataNodes: ds_${0..7}.player_currency
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_equipment:
        actualDataNodes: ds_${0..7}.player_equipment
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_quest:
        actualDataNodes: ds_${0..7}.player_quest
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_skill:
        actualDataNodes: ds_${0..7}.player_skill
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_mail:
        actualDataNodes: ds_${0..7}.player_mail
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
      player_social:
        actualDataNodes: ds_${0..7}.player_social
        databaseStrategy:
          standard:
            shardingColumn: player_id
            shardingAlgorithmName: player_id_inline
        tableStrategy:
          none:
    defaultDatabaseStrategy:
      none:
    defaultTableStrategy:
      none:
    shardingAlgorithms:
      player_id_inline:
        type: INLINE
        props:
          algorithm-expression: ds_${player_id % 8}
