databaseName: cami_db

# ============================================================================
# CAMI ShardingSphere 配置 — Dev-Mini 起步档 (Scale-to-Fit)
# ----------------------------------------------------------------------------
# 逻辑分片固定 8 (player_id % 8, ADR-003), 但 8 个分片库全部位于同一物理 MySQL
# 实例 (mysql-mini)。扩容时: 起新实例 -> 搬库 -> 仅改本文件 dataSource URL,
# 分片算法与业务代码零改动、数据零重分布。详见 docs/architecture/scale-to-fit.md。
#
# 与 Dev-Std (config-cami_db.yaml) 的差异:
#   - 无 READWRITE_SPLITTING (从库未部署, 读写分离在扩容阶段开启)
#   - maxPoolSize 2 (起步连接数减半, 省内存)
#   - 8 个逻辑分片 URL 指向同一实例的不同库
# 注意    : 代理登录 root/root (SS 5.5.0 frontend 怪癖, 见 server.yaml)。
# ============================================================================

dataSources:
  ds_0:
    url: "jdbc:mysql://mysql-mini:3306/cami_shard_0?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai"
    username: root
    password: cami_dev_2026
    connectionTimeoutMilliseconds: 30000
    idleTimeoutMilliseconds: 60000
    maxLifetimeMilliseconds: 1800000
    maxPoolSize: 2
