# deploy/k8s/04-gateway.yaml — Gateway（连接 / Session / 心跳 / 安全 / 限流 / 路由）
# 对外暴露 9001；与 GameNode 走 gRPC（9101）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mmorpg
spec:
  replicas: 10            # 初始规划：10 active + failover 余量
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: mmorpg/gateway:latest
          envFrom:
            - configMapRef: { name: mmorpg-config }
          ports:
            - containerPort: 9001
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          readinessProbe:
            tcpSocket: { port: 9001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9001 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: mmorpg
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports:
    - port: 9001
      targetPort: 9001
