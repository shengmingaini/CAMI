# deploy/k8s/06-control.yaml — ControlService（Config / 节点管理 / 版本 / 热更 / 部署）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  namespace: mmorpg
spec:
  replicas: 2             # 控制面需要冗余，避免单点
  selector:
    matchLabels: { app: control }
  template:
    metadata:
      labels: { app: control }
    spec:
      containers:
        - name: control
          image: mmorpg/control:latest
          envFrom:
            - configMapRef: { name: mmorpg-config }
          ports:
            - containerPort: 9100
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          readinessProbe:
            tcpSocket: { port: 9100 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9100 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: control
  namespace: mmorpg
spec:
  selector: { app: control }
  ports:
    - port: 9100
      targetPort: 9100
