name: CAMI CI

# 触发：主干/开发分支的 push 与 PR
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build:
    name: Build & Layered Skeleton Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-dev libboost-system-dev

      - name: Configure (lightweight skeleton — no heavy deps)
        # CAMI_BUILD_MODULES=OFF：跳过 gRPC/Protobuf/Redis/Sol2/Lua 等重型依赖，
        # 仅编译五层骨架 + benchmark(TCP Echo, Boost asio) + 分层自检。
        # 重型依赖在各层实现阶段开启，保证 CI 在标准 runner 上快速绿灯。
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCAMI_BUILD_MODULES=OFF

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Layered skeleton self-check (ctest)
        # 机器校验：五层已接入 monorepo 构建，目录↔分层↔target 一一对应。
        run: ctest --test-dir build --output-on-failure

  # === 经济平衡门禁 ===
  # 独立 job：不依赖 C++ 工具链，职责单一、与 build 并行、失败隔离。
  # 把 GAP-1~9 的平衡校验（源汇账本 / xp 曲线完整性 / 战斗强度离散度 / leak 语义 /
  # 修理对账 / 囤积上限）固化成 PR 防线：balance_verifier 在 FAIL>0 时退出码 1，CI 即红。
  economy-balance:
    name: Economy Balance Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps (protobuf runtime; protoc kept for local stub regen)
        # _pb2 桩已提交仓库，CI 直接 import 已验证正确的桩，无需运行时 protoc；
        # protoc 仅作为本地 .proto 变更后重新生成桩的兜底（load_configs 在桩缺失/过期时调用）。
        # 锁定 protobuf 版本，复现本地验证运行时。
        run: pip install --upgrade pip "protobuf==7.35.1" grpcio-tools

      - name: Run balance verifier
        # 干净检出时直接 import 已提交的 verify/_pb 桩；仅当 .proto 比桩新才现场 regen。
        run: cd verify && python balance_verifier.py

  # === 真实后端门禁（MODULES=ON）===
  # 端到端验证 AES-GCM(OpenSSL) 真实路径 + RedisClusterState(redis-plus-plus) 连真集群读写。
  # 重型依赖走 vcpkg（二进制缓存加速重跑）；Boost 由 apt 提供（vcpkg 不提供 umbrella Boost config）。
  # 整个 job 跑在 ubuntu 容器里，redis-cluster 服务容器与 job 容器同网络：按服务名可达、集群内网 IP 互通。
  build-modules-on:
    name: Build & Real-Backend Tests (MODULES=ON)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 240
    services:
      redis-cluster:
        image: grokzen/redis-cluster:7.0
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
    steps:
      - name: Install system build dependencies (git + Boost via apt)
        # vcpkg 从源码构建重型依赖需要完整工具链（compiler/make/ninja/perl/pkg-config 等）。
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build pkg-config perl python3 \
            tar unzip curl zip autoconf automake libtool build-essential \
            libboost-dev libboost-system-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Cache vcpkg installed tree + binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ${{ github.workspace }}/vcpkg-bincache
          key: ${{ runner.os }}-vcpkg-modules-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-modules-

      - name: Build dependencies (vcpkg, manifest mode)
        run: $VCPKG_ROOT/vcpkg install

      - name: Configure (MODULES=ON via vcpkg toolchain)
        # Boost 由 apt 提供（-DBOOST_ROOT=/usr），其余重型依赖由 vcpkg 工具链注入。
        run: cmake -B build-mod -DCMAKE_BUILD_TYPE=Release -DCAMI_BUILD_MODULES=ON -DCAMI_BUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DBOOST_ROOT=/usr

      - name: Build
        run: cmake --build build-mod --config Release -j"$(nproc)"

      - name: Real-backend tests (ctest + live Redis Cluster)
        # CAMI_REDIS_CLUSTER_URI 驱动 redis_test.cpp 中 RedisClusterState 真实读写用例；未设置则跳过。
        env:
          CAMI_REDIS_CLUSTER_URI: redis://redis-cluster:7000
        run: ctest --test-dir build-mod --output-on-failure
