name: build

# CI 环境与本地验收环境一比一对齐：windows-latest + MSYS2 MinGW64 工具链。
# 所有第三方依赖经 pacman 安装（与本机同款包）：protoc / flatc / grpc_cpp_plugin /
# Lua / OpenSSL / libmariadb / argon2 全部就位，configure 不再 FATAL_ERROR。
#
# 说明：
#  · 原 lukka/run-vcpkg 步骤已移除——vcpkg.json 的 dependencies 为空数组，且
#    从未向 cmake 传 vcpkg toolchain，该步骤纯属空转（约 2-5 分钟）。
#  · Linux (ubuntu) 平台暂未纳入：网络层虽保留 POSIX 分支，但未经 Linux
#    实机编译验证，贸然上矩阵必然红。待 Windows 通道稳定后再单独验证接入。
#  · Build 失败时自动把日志尾部推送到 ci-logs 分支（仅诊断用，不碰 main），
#    便于无需 admin token 即可读取原始错误。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          release: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-flatbuffers
            mingw-w64-x86_64-grpc
            mingw-w64-x86_64-libmariadbclient
            mingw-w64-x86_64-argon2

      - name: Toolchain info
        shell: msys2 {0}
        run: |
          which cmake g++ ninja protoc flatc grpc_cpp_plugin pkg-config
          g++ --version | head -1
          cmake --version | head -1
          protoc --version
          flatc --version

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMMORPG_BUILD_TESTS=ON

      - name: Build
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake --build build -j 2>&1 | tee build_log.txt

      - name: Collect build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn

      - name: Push build log to ci-logs branch
        if: failure()
        shell: msys2 {0}
        run: |
          ls -la build_log.txt || true
          tail -n 300 build_log.txt > ci_failure.log || true
          git config user.name "ci-log-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci_failure.log
          git commit -m "ci: build failure log (run ${GITHUB_RUN_ID})" || true
          git push --force origin HEAD:ci-logs

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
